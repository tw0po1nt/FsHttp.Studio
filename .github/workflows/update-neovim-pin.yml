name: Update Neovim pin

# Opens a pull request when the stable Neovim pin falls behind the latest Neovim release, then
# starts the Neovim tests workflow against the pin branch. That run is the gate for the new
# version: green means a merge completes the update.
#
# The pull request cannot start the gate on its own. GitHub raises no push or pull_request event
# for anything the built-in GITHUB_TOKEN does, so a pull request that this workflow opens has no
# checks. workflow_dispatch is the documented exception, so this workflow dispatches the Neovim
# tests workflow by hand and links the run from the pull request.
#
# Only the `stable` key moves. The `floor` key is the oldest Neovim version that the client
# supports, and a person changes it on purpose.
on:
  schedule:
    # Weekly, on Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-neovim-pin
  cancel-in-progress: false

permissions:
  contents: write # push the pin branch
  pull-requests: write # open the pin-update pull request, and comment the gate link on it
  actions: write # dispatch the Neovim tests workflow against the pin branch

env:
  PIN_FILE: tests/nvim/neovim-pin.json
  GATE_WORKFLOW: nvim-tests.yml

jobs:
  update-pin:
    name: Compare pin and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest stable Neovim version
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN="$(jq -r .stable "$PIN_FILE")"
          # The latest release excludes the nightly and stable tags, which are moving tags.
          LATEST="$(gh api repos/neovim/neovim/releases/latest --jq .tag_name)"
          if ! printf '%s' "$LATEST" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not resolve the latest stable Neovim version. The API gave '$LATEST'."
            exit 1
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          # The job opens a pull request only when the pin is behind the latest release. A person can
          # set the pin ahead of the latest release, and that pin must not cause a weekly downgrade.
          NEWEST="$(printf '%s\n%s\n' "$PIN" "$LATEST" | sort -V | tail -1)"
          if [ "$PIN" = "$LATEST" ] || [ "$NEWEST" = "$PIN" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pin $PIN is at or ahead of the latest release $LATEST."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pin $PIN is behind the latest release $LATEST."
          fi

      - name: Push the updated pin and open a pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.pin.outputs.pin }}
          LATEST: ${{ steps.pin.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="chore/neovim-pin-${LATEST}"

          # One open pull request for each target version. A later weekly run must not open a
          # duplicate while the first pull request waits for review.
          EXISTING="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Pull request #$EXISTING already updates the pin to $LATEST."
            exit 0
          fi

          jq --arg v "$LATEST" '.stable = $v' "$PIN_FILE" > "${PIN_FILE}.tmp"
          mv "${PIN_FILE}.tmp" "$PIN_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$PIN_FILE"
          git commit -m "$(cat <<EOF
          Update the stable Neovim pin to ${LATEST}.

          The previous pin was ${PIN}. The Neovim tests workflow on this branch is the gate for the new version.
          EOF
          )"

          # A branch can survive a closed pin pull request, so this push may need to overwrite one.
          # checkout fetches a single ref, so a bare --force-with-lease has no remote-tracking ref
          # to compare and refuses the push. Fetch the branch first, and state the tip that the
          # lease expects.
          if git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            git push -u origin "HEAD:refs/heads/${BRANCH}" \
              --force-with-lease="refs/heads/${BRANCH}:$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          else
            git push -u origin "HEAD:refs/heads/${BRANCH}"
          fi

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update stable Neovim pin to ${LATEST}" \
            --body "$(cat <<EOF
          ## Summary

          The \`stable\` pin in \`${PIN_FILE}\` is \`${PIN}\`.
          The latest Neovim release is \`${LATEST}\`.
          This pull request sets \`stable\` to \`${LATEST}\`.

          ## Gate

          The Neovim tests workflow against this branch is the gate run for the new version.
          A green run on the three legs that use the stable pin means that a merge completes the update.
          A comment below links the run. The run does not appear as a check on this
          pull request, because a run that this workflow starts is not attached to it.
          EOF
          )")"
          echo "Opened $PR_URL"

          # The gate. GITHUB_TOKEN raises no pull_request event, so the workflow needs dispatching
          # by hand against the branch.
          gh workflow run "$GATE_WORKFLOW" --ref "$BRANCH"
          GATE_RUNS="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${GATE_WORKFLOW}?query=branch%3A${BRANCH}"
          gh pr comment "$PR_URL" --body "Gate run for \`${LATEST}\`: ${GATE_RUNS}"
