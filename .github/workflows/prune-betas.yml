name: Prune Betas

# Deletes the Betas for a version when that version ships. A superseded Beta has
# no audience, and it is an opportunity to install the wrong build.
#
# The trigger is `release: published`, and not a step in release.yml. release.yml
# creates a *draft*, which a human then reviews and publishes. A prune step inside
# release.yml would therefore delete the Betas before anybody published anything,
# and a draft that is never published would take its Betas with it.
on:
  release:
    types: [published]

concurrency:
  group: prune-betas
  cancel-in-progress: false

permissions:
  contents: write # delete the pre-releases and their tags

jobs:
  prune:
    # Publishing a Beta must not prune the Betas.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the Betas for this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Escape the dots, so that the pattern does not match another version.
          PATTERN="^v$(printf '%s' "$VERSION" | sed 's/\./\\./g')-beta\.[0-9]+$"

          BETAS=$(gh release list --repo "$REPO" --limit 200 --json tagName \
            --jq '.[].tagName' | grep -E "$PATTERN" || true)

          if [ -z "$BETAS" ]; then
            echo "No Beta to prune for $TAG."
            exit 0
          fi

          echo "$BETAS" | while read -r BETA_TAG; do
            echo "Deleting $BETA_TAG"
            gh release delete "$BETA_TAG" --repo "$REPO" --yes --cleanup-tag
          done
