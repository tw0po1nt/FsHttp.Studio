name: Release

# GitHub Releases channel (direct .vsix download). Manual only — an operator clicks
# "Run workflow". Registry publishing (vsce / ovsx) stays manual and is out of scope here.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag + Release, upload the .vsix asset

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + tag from the manifest
        id: version
        working-directory: extension-host
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Guard against re-releasing an existing version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — bump extension-host/package.json version before releasing."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: extension-host/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '.config/dotnet-tools.json') }}

      - run: dotnet tool restore

      # Same guardrails as ci.yml — a red build can never ship a release.
      - run: dotnet fantomas --check .

      - run: dotnet build FsHttp.Studio.slnx

      - run: dotnet test FsHttp.Studio.slnx --no-build

      - run: npm ci
        working-directory: extension-host

      # Runs the bundled renderer under node — the "bundles and runs" guard the .NET
      # tests can't cover. Same as ci.yml; a release can't ship a bundle that won't run.
      - run: npm run smoke
        working-directory: extension-host

      # Builds the single universal .vsix (compile + sync license/readme + vsce package),
      # output extension-host/fshttp-studio-<version>.vsix.
      - run: npm run package
        working-directory: extension-host

      - name: Publish draft GitHub Release with the .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true # a human reviews the asset + notes, then clicks Publish
          make_latest: true # takes effect once the draft is published
          generate_release_notes: true
          files: extension-host/fshttp-studio-${{ steps.version.outputs.version }}.vsix
