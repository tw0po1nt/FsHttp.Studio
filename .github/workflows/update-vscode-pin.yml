name: Update VSCode pin

# Opens a pull request when the ExTester VSCode pin falls behind the latest
# stable release, then starts the UI tests job against the pin branch. That
# run is the gate for the new version: green means a merge completes the
# update.
#
# The pull request cannot start the gate on its own. GitHub does not raise
# push or pull_request events for anything the built-in GITHUB_TOKEN does,
# so a pull request opened here lands with no checks. workflow_dispatch is
# the documented exception, so this workflow dispatches the UI tests job by
# hand and links the run from the pull request.
#
# Uses gh throughout with the built-in GITHUB_TOKEN. No third-party action
# opens the pull request. Permissions stay on this workflow only.
#
# A hold stops the pull request. tests/ui.Tests/vscode-pin-hold.json names the
# first version known to fail the suite. While the latest stable release is at
# or above that version, every pull request this job could open would be red on
# arrival, and a red pull request that reappears every Monday teaches the reader
# to ignore the gate. The job reports the hold in the run summary instead.
#
# The hold has no way to notice that the defect was fixed upstream, because only
# a suite run against the new version can tell. Run this workflow by hand with
# the probe input to open the pull request anyway, which dispatches that run.
# Delete the hold file once a version passes.
on:
  schedule:
    # Weekly. A no-op week is free. A patch that breaks ChromeDriver must not
    # wait three weeks to surface.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Open the pin-update pull request even while a hold is in force.'
        type: boolean
        required: false
        default: false

concurrency:
  group: update-vscode-pin
  cancel-in-progress: false

permissions:
  contents: write # push the pin branch
  pull-requests: write # open the pin-update pull request, and comment the gate link on it
  actions: write # dispatch the UI tests job against the pin branch

env:
  CONFIG: tests/ui.Tests/extester.config.json
  HOLD: tests/ui.Tests/vscode-pin-hold.json
  GATE_WORKFLOW: ui-tests.yml

jobs:
  update-pin:
    name: Compare pin and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest stable VSCode version
        id: pin
        env:
          # Empty on the weekly schedule, which reads as "not true" below.
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          PIN="$(jq -r .setup.vscodeVersion "$CONFIG")"
          # Same API ExTester uses for "latest": first entry in the stable stream.
          LATEST="$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Could not resolve the latest stable VSCode version."
            exit 1
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          # Behind, not merely different. A pin deliberately set ahead of stable
          # must not produce a downgrade pull request every Monday.
          NEWEST="$(printf '%s\n%s\n' "$PIN" "$LATEST" | sort -V | tail -1)"
          if [ "$PIN" = "$LATEST" ] || [ "$NEWEST" = "$PIN" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "Pin $PIN is at or ahead of the latest stable release $LATEST."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pin $PIN is behind the latest stable release $LATEST."

          # The hold. No file means no hold, which is the normal state.
          if [ ! -f "$HOLD" ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BAD="$(jq -r '.knownBadFrom // empty' "$HOLD")"
          if [ -z "$BAD" ]; then
            echo "::error::$HOLD names no knownBadFrom version. Give it one, or delete the file."
            exit 1
          fi

          echo "bad=$BAD" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason // empty' "$HOLD")" >> "$GITHUB_OUTPUT"

          # At or above the first known-bad version. A hold below the latest release
          # would leave a good version unoffered, so the comparison must include the
          # bad version itself and everything after it.
          NEWEST_OF_BAD="$(printf '%s\n%s\n' "$BAD" "$LATEST" | sort -V | tail -1)"
          if [ "$NEWEST_OF_BAD" != "$LATEST" ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "Latest stable $LATEST is below the held version $BAD."
            exit 0
          fi

          if [ "${PROBE}" = "true" ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "probed=true" >> "$GITHUB_OUTPUT"
            echo "A hold is in force from $BAD, and the probe input overrides it."
          else
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A hold is in force from $BAD. No pull request opens for $LATEST."
          fi

      - name: Report the hold
        if: steps.pin.outputs.held == 'true'
        env:
          PIN: ${{ steps.pin.outputs.pin }}
          LATEST: ${{ steps.pin.outputs.latest }}
          BAD: ${{ steps.pin.outputs.bad }}
          REASON: ${{ steps.pin.outputs.reason }}
        run: |
          {
            echo "## The VSCode pin is held"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Pin | \`$PIN\` |"
            echo "| Latest stable | \`$LATEST\` |"
            echo "| Held from | \`$BAD\` |"
            echo
            echo "$REASON"
            echo
            echo "No pull request opened. Every version at or above \`$BAD\` fails the suite,"
            echo "so the pull request would be red on arrival."
            echo
            echo "Run this workflow by hand with the **probe** input to test \`$LATEST\` anyway."
            echo "Delete \`$HOLD\` once a version passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the updated pin and open a pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.pin.outputs.pin }}
          LATEST: ${{ steps.pin.outputs.latest }}
          PROBED: ${{ steps.pin.outputs.probed }}
        run: |
          set -euo pipefail
          BRANCH="chore/vscode-pin-${LATEST}"

          # A probe tests a version that a hold says is bad, so its pull request needs
          # the extra instruction: a green run retires the hold, and the hold file must
          # go in this same pull request. A merge that leaves it names a version that
          # the pin has already passed.
          if [ "${PROBED}" = "true" ]; then
            PROBE_NOTE="$(cat <<EOF

          ## This is a probe

          A hold in \`${HOLD}\` says that \`${LATEST}\` fails the suite. This pull
          request tests that claim anyway.

          A red gate run means the hold still holds. Close this pull request.
          A green gate run retires the hold. Delete \`${HOLD}\` in this pull
          request before you merge it.
          EOF
          )"
          else
            PROBE_NOTE=""
          fi

          # One open pull request per target version. A later weekly run must
          # not open a duplicate while the first pull request waits for review.
          EXISTING="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Pull request #$EXISTING already updates the pin to $LATEST."
            exit 0
          fi

          jq --arg v "$LATEST" \
            '.setup.vscodeVersion = $v | .run.vscodeVersion = $v' \
            "$CONFIG" > "${CONFIG}.tmp"
          mv "${CONFIG}.tmp" "$CONFIG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$CONFIG"
          git commit -m "$(cat <<EOF
          Update the ExTester VSCode pin to ${LATEST}.

          The previous pin was ${PIN}. The UI tests job on this pull request is the gate for the new version.
          EOF
          )"

          # A branch can survive a closed pin pull request, so this push may need
          # to overwrite one. checkout fetches a single ref, so a bare
          # --force-with-lease has no remote-tracking ref to compare and refuses
          # the push. Fetch the branch first, and state the tip the lease expects.
          if git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            git push -u origin "HEAD:refs/heads/${BRANCH}" \
              --force-with-lease="refs/heads/${BRANCH}:$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          else
            git push -u origin "HEAD:refs/heads/${BRANCH}"
          fi

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update ExTester VSCode pin to ${LATEST}" \
            --body "$(cat <<EOF
          ## Summary

          The pin in \`${CONFIG}\` is \`${PIN}\`.
          The latest stable VSCode release is \`${LATEST}\`.
          This pull request sets \`setup.vscodeVersion\` and \`run.vscodeVersion\` to \`${LATEST}\`.

          ## Gate

          The UI tests job against this branch is the gate run for the new version.
          A green run means that a merge completes the update.
          A comment below links the run: it does not appear as a check on this
          pull request, because a run this workflow starts is not attached to it.
          ${PROBE_NOTE}
          EOF
          )")"
          echo "Opened $PR_URL"

          # The gate. GITHUB_TOKEN raises no pull_request event, so the job needs
          # dispatching by hand against the branch.
          gh workflow run "$GATE_WORKFLOW" --ref "$BRANCH"
          GATE_RUNS="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${GATE_WORKFLOW}?query=branch%3A${BRANCH}"
          gh pr comment "$PR_URL" --body "Gate run for \`${LATEST}\`: ${GATE_RUNS}"
