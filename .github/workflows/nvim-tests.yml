# Runs the Neovim suite and the Lua core suite on four legs: Linux with Neovim 0.11, and Linux,
# macOS, and Windows with the pinned stable Neovim.
name: Neovim tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nvim-tests.yml'
      # The suite steps live in a composite action.
      - '.github/actions/run-nvim-suite/action.yml'
      - 'build.lua'
      - 'lazy.lua'
      - 'lua/**'
      - 'plugin/**'
      - 'tests/golden/**'
      - 'tests/lua/**'
      - 'tests/minit.lua'
      - 'scripts/pack-companion.sh'
      - 'tests/nvim/**'
      # The Neovim suite uses the test HTTP server of the UI suite.
      - 'tests/ui.Tests/server/**'
      - 'tests/ui.Tests/fixtures/**'
      - 'src/**'
      - 'global.json'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch stops the run of the older push. A run on main always completes.
concurrency:
  group: nvim-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nvim-tests:
    name: Neovim suites (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The Windows leg is the slowest. The suite has its own Budgets, and this cap stops a wedged runner.
    timeout-minutes: 30
    strategy:
      # A red leg must not hide the result of the other legs.
      fail-fast: false
      matrix:
        include:
          - name: Linux, Neovim 0.11
            os: ubuntu-latest
            neovim-pin: floor
          - name: Linux, pinned stable Neovim
            os: ubuntu-latest
            neovim-pin: stable
          - name: macOS, pinned stable Neovim
            os: macos-latest
            neovim-pin: stable
          - name: Windows, pinned stable Neovim
            os: windows-latest
            neovim-pin: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '.config/dotnet-tools.json') }}

      - uses: ./.github/actions/run-nvim-suite
        with:
          neovim-pin: ${{ matrix.neovim-pin }}
