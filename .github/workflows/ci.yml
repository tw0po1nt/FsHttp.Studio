name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: ./scripts/check-banned-patterns.sh

      - name: Check the Lua format
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: '2.5.2'
          args: --check .

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '.config/dotnet-tools.json') }}

      - run: dotnet tool restore

      - run: dotnet fantomas --check .

      - run: dotnet fsi scripts/generate-lua.fsx --check

      - run: dotnet build FsHttp.Studio.slnx

      - run: dotnet test FsHttp.Studio.slnx --no-build

      - run: npm ci

      # Runs npm run compile, then builds the .vsix.
      - run: npm run package

      - run: ./scripts/check-vsix-holds-no-lua.sh

      # Runs the renderer core's Fable/JS output under node — the guard that "compiles under Fable"
      # actually "bundles and runs", which the .NET Seam-B suite structurally can't cover.
      - run: npm run smoke

      - name: Read the Neovim pins
        id: nvim-pin
        run: |
          set -euo pipefail
          echo "floor=$(jq -r .floor tests/nvim/neovim-pin.json)" >> "$GITHUB_OUTPUT"
          echo "stable=$(jq -r .stable tests/nvim/neovim-pin.json)" >> "$GITHUB_OUTPUT"

      # The Neovim client supports Neovim 0.11 and later, so the type check uses the 0.11 API types.
      - name: Install Neovim ${{ steps.nvim-pin.outputs.floor }} for its API types
        id: nvim-types
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.nvim-pin.outputs.floor }}

      - name: Install lua-language-server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lua-language-server"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/lua-language-server"
          echo "$RUNNER_TEMP/lua-language-server/bin" >> "$GITHUB_PATH"

      - name: Check the Lua types against the Neovim 0.11 API
        env:
          VIMRUNTIME: ${{ steps.nvim-types.outputs.vim-dir }}/runtime
        run: ./scripts/check-lua-types.sh

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ steps.nvim-pin.outputs.stable }}

      - name: Install the readline headers that hererocks needs to build Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Run the Lua core suite
        run: nvim -l tests/minit.lua --minitest
