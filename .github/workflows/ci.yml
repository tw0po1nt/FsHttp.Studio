name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '.config/dotnet-tools.json') }}

      - run: dotnet tool restore

      - run: dotnet fantomas --check .

      - run: dotnet build FsHttp.Studio.slnx

      - run: dotnet test FsHttp.Studio.slnx --no-build

      - run: npm ci

      - run: npm run compile

      # Runs the renderer core's Fable/JS output under node — the guard that "compiles under Fable"
      # actually "bundles and runs", which the .NET Seam-B suite structurally can't cover.
      - run: npm run smoke
