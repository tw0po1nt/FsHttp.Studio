# Single CI entry point for the ExTester UI suite. Local runs use the same run.sh.
name: UI tests

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ui-tests.yml'
      # The suite steps live in a composite action that release.yml also calls, so a change
      # to either one must re-run the suite here.
      - '.github/actions/run-ui-suite/action.yml'
      - '.github/workflows/release.yml'
      - '.config/dotnet-tools.json'
      - 'esbuild.mjs'
      - 'global.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/ui.Tests/**'
      - 'webpack.config.js'
      - '.vscodeignore'
      - '**/*.fsproj'
  push:
    branches: [main]
  workflow_dispatch:

# Supersede a branch's own in-flight run only. A run on main, or one a workflow_call caller
# is waiting on, must finish — cancelling it would leave the gate's verdict ambiguous.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI test suite
    runs-on: ubuntu-latest
    # Covers three 20-minute suite attempts plus setup. The 20-minute bound that matters
    # is per attempt, inside the composite action; this cap only stops a wedged runner
    # billing forever.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '.config/dotnet-tools.json') }}

      - run: dotnet tool restore

      - run: npm ci

      - name: Package extension (.vsix)
        id: vsix
        run: |
          set -euo pipefail
          npm run package
          VSIX="$(ls -1 fshttp-studio-*.vsix | tail -1)"
          echo "path=$PWD/$VSIX" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-ui-suite
        with:
          vsix-path: ${{ steps.vsix.outputs.path }}
          failure-artifact-label: ci
